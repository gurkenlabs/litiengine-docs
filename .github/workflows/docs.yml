name: Publish Documentation

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: pip install -r requirements-docs.txt

      - name: Validate Markdown & Links
        run: |
          python .github/scripts/lint_markdown.py
          python .github/scripts/validate_links.py
          python .github/scripts/generate_llms.py

      - name: Build Static Documentation
        run: zensical build --clean --strict

      - name: Checkout Engine Repository
        uses: actions/checkout@v4
        with:
          repository: gurkenlabs/litiengine
          ref: main
          path: litiengine-src

      - name: Setup Java 25 for Engine
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and Bundle Javadoc
        run: |
          cd litiengine-src
          chmod +x gradlew
          ./gradlew :litiengine:javadoc --no-daemon -PskipSpotless
          cd ..
          mkdir -p site/javadoc
          cp -r litiengine-src/litiengine/build/docs/javadoc/* site/javadoc/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
